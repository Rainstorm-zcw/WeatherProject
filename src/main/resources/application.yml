server:
  port: 9989
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: windy-open-meteo
  jackson:
    default-property-inclusion: non_null

# Open-Meteo 相关配置
open-meteo:
  # 免费版无需 API Key
  base-url: https://api.open-meteo.com
  # 返回的 hourly.time 使用该时区的本地时间
  timezone: Asia/Shanghai
  connect-timeout: 5s
  read-timeout: 15s
  # 未传经纬度时的默认坐标（北京）
  default-latitude: 39.9042
  default-longitude: 116.4074
  default-forecast-days: 7

# springdoc / Knife4j 接口文档
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

knife4j:
  enable: true
  setting:
    language: zh_cn

logging:
  level:
    org.example: info
