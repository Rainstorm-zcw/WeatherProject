server:
  port: 9989
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: windy-open-meteo
  jackson:
    default-property-inclusion: non_null

# Open-Meteo 相关配置
open-meteo:
  # 免费版无需 API Key
  base-url: https://api.open-meteo.com
  # 返回的 hourly.time 使用该时区的本地时间
  timezone: Asia/Shanghai
  connect-timeout: 5s
  read-timeout: 15s
  # 未传经纬度时的默认坐标（北京）
  default-latitude: 39.9042
  default-longitude: 116.4074
  default-forecast-days: 7

# Windy 平台配置
windy:
  account-base-url: https://account.windy.com
  node-base-url: https://node.windy.com
  version: 51.4.4
  country: my
  # Windy 前端 Accept；官网用空格分隔，这里用逗号避免 Spring 解析异常
  accept-header: "application/json, binary/hdagag$indc444"
  default-model: icon
  default-days: 5
  # 1=逐小时（需要 premium 账号），3=3 小时
  default-step: 1
  timezone: Asia/Shanghai
  connect-timeout: 5s
  read-timeout: 30s
  refresh-before: 10m
  # 自动登录；关闭后只能使用游客 token（3 小时步长）
  login-enabled: true
  # 建议用环境变量覆盖，避免把账号密码提交到仓库
  email: ${WINDY_EMAIL}
  password: ${WINDY_PASSWORD}
  radiation:
    # Windy point API 没有辐照字段，用 Open-Meteo 的 shortwave_radiation 补齐
    open-meteo-fallback: true

# springdoc / Knife4j 接口文档
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

knife4j:
  enable: true
  setting:
    language: zh_cn

logging:
  level:
    org.example: info
